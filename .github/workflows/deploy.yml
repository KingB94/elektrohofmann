# ---------------------------------------------------------------
# Baut die Website und veröffentlicht sie auf Cloudflare Workers.
#
# Läuft bei jedem Push auf main — also auch dann, wenn der Kunde im
# Redaktionssystem auf „Save" klickt: Keystatic schreibt die Änderung
# als Commit, dieser Workflow baut daraus die neue Seite. Vom Klick
# bis zur fertigen Seite vergehen ein bis zwei Minuten.
#
# Reine Dokumentations-Commits lösen bewusst nichts aus (paths-ignore).
# Die Inhalte des Editors liegen als .json unter content/ und sind
# davon nicht betroffen.
#
# ---------------------------------------------------------------
# Was im Repository hinterlegt sein muss
# (Settings → Secrets and variables → Actions):
#
#   Secrets — geheim:
#     CLOUDFLARE_API_TOKEN    Token mit Rechten für Workers
#     CLOUDFLARE_ACCOUNT_ID   Konto-Kennung aus dem Cloudflare-Dashboard
#
#   Variables — nicht geheim, stehen später ohnehin in der Seite:
#     NEXT_PUBLIC_SITE_URL                   z. B. https://www.elektrohofmann.info
#     NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG  Kennung der GitHub-App
#
# ⚠️ Die beiden NEXT_PUBLIC_-Werte werden beim Bauen fest in die Seiten
#    eingebaut. Ändert sich einer, genügt kein Neustart — es muss neu
#    gebaut werden. Dafür gibt es unten „Run workflow" von Hand.
#
# Die Zugangsdaten des Redaktionssystems (KEYSTATIC_*) gehören NICHT
# hierher. Die liegen als Secrets direkt beim Worker und werden zur
# Laufzeit gebraucht, nicht beim Bauen. Ein Deploy überschreibt sie nicht.
# Einen Schlüssel für Mailversand gibt es bewusst nicht: Das Formular
# öffnet das Mailprogramm des Besuchers, es verschickt nichts selbst.
# ---------------------------------------------------------------

name: Auf Cloudflare veröffentlichen

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

# Zwei schnell aufeinanderfolgende Änderungen im Editor sollen sich
# nicht überholen. Der zweite Lauf wartet, statt den ersten mitten im
# Hochladen abzubrechen.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Bauen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Die Voreinstellung des Repositories ist nur Lesen. Der letzte
    # Schritt legt bei einem Fehlschlag ein Issue an und braucht dafür
    # ausdrücklich Schreibrechte — an dieser einen Stelle, nicht global.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # Wrangler verlangt mindestens Node 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Lieber hier mit einer klaren Meldung stehen bleiben als später
      # mit einer Website, in der die falsche Adresse eingebaut ist.
      - name: Voraussetzungen prüfen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          fehlt=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || fehlt="$fehlt\n  - Secret CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || fehlt="$fehlt\n  - Secret CLOUDFLARE_ACCOUNT_ID"
          [ -n "$NEXT_PUBLIC_SITE_URL" ]  || fehlt="$fehlt\n  - Variable NEXT_PUBLIC_SITE_URL"
          if [ -n "$fehlt" ]; then
            printf 'Es fehlen Angaben im Repository:%b\n\n' "$fehlt"
            echo 'Nachzutragen unter Settings → Secrets and variables → Actions.'
            exit 1
          fi
          echo "Alles da. Adresse: $NEXT_PUBLIC_SITE_URL"

      - name: Pakete installieren
        run: npm ci

      - name: Website und Worker bauen
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
        run: npx opennextjs-cloudflare build

      # Lädt den Worker, die statischen Dateien und die vorgerenderten
      # Seiten hoch. Nicht durch `wrangler deploy` ersetzen — das lässt
      # die vorgerenderten Seiten weg, und dann antwortet jede Seite
      # mit 500.
      - name: Auf Cloudflare veröffentlichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      - name: Erreichbarkeit prüfen
        if: vars.NEXT_PUBLIC_SITE_URL != ''
        run: |
          adresse="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          echo "Warte kurz, bis die neue Fassung ausgerollt ist …"
          sleep 15
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$adresse/")
          echo "Startseite unter $adresse antwortet mit $status"
          # Nur ein Hinweis: Direkt nach dem Umstellen der Domain kann
          # hier noch die alte Antwort stehen. Das ist kein Grund, den
          # Lauf rot zu färben.
          [ "$status" = "200" ] || echo "::warning::Noch kein 200 — bitte von Hand nachsehen."

      # ---------------------------------------------------------------
      # Ohne diesen Schritt scheitert das Veröffentlichen lautlos.
      #
      # Der Kunde klickt im Editor auf „Save", Keystatic bestätigt das
      # Speichern — und wenn der Build danach abbricht, bleibt die Website
      # auf dem alten Stand stehen, ohne dass irgendwo etwas rot leuchtet.
      # Seine Änderung ist nicht verloren, sie kommt nur nie an. GitHub
      # meldet den Fehlschlag per Mail ausschließlich an denjenigen, der
      # den Commit ausgelöst hat: den Kunden, der mit „error TS2352"
      # nichts anfangen kann. Im September 2026 stand die Seite deshalb
      # zehn Tage still, bevor es jemandem auffiel.
      #
      # Ein Issue landet dagegen bei uns. Läuft schon eines offen, wird
      # nur kommentiert — sonst entsteht bei einem dauerhaften Fehler mit
      # jedem Speichern des Kunden ein weiterer Eintrag.
      # ---------------------------------------------------------------
      - name: Bei Fehlschlag Bescheid geben
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUSGELOEST_VON: ${{ github.actor }}
          NACHRICHT: ${{ github.event.head_commit.message }}
          BETREUER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          marke="deploy-fehler"

          # Nur die erste Zeile der Commit-Nachricht; der Rest ist hier Beiwerk.
          aenderung="${NACHRICHT%%$'\n'*}"

          text="@${BETREUER} — die Website konnte nicht veröffentlicht werden.

          **Sie ist online, steht aber auf dem Stand von vor dieser Änderung.**

          | | |
          |---|---|
          | Änderung | ${aenderung:-ohne Nachricht} |
          | Ausgelöst von | ${AUSGELOEST_VON} |
          | Protokoll | ${LAUF} |

          Im Protokoll steht, woran es gescheitert ist. Nach dem Beheben genügt
          ein Push auf \`main\` — oder „Run workflow\" von Hand."

          # Beim ersten Fehlschlag gibt es das Etikett noch nicht.
          gh label create "$marke" --color B60205 \
            --description "Veröffentlichung fehlgeschlagen" >/dev/null 2>&1 || true

          offen=$(gh issue list --label "$marke" --state open --limit 1 \
            --json number --jq '.[0].number // empty')

          if [ -n "$offen" ]; then
            gh issue comment "$offen" --body "$text"
          else
            neu=$(gh issue create \
              --title "Veröffentlichung fehlgeschlagen — die Website steht auf altem Stand" \
              --label "$marke" \
              --body "$text")
            echo "$neu"
            # Zuweisen ist Beiwerk: Schlägt es fehl, soll das Issue trotzdem stehen.
            gh issue edit "${neu##*/}" --add-assignee "$BETREUER" >/dev/null 2>&1 || true
          fi
