# ---------------------------------------------------------------
# Netlify-Konfiguration.
#
# Das Next.js-Plugin erkennt Netlify automatisch — hier stehen nur
# die Dinge, die nicht von allein passen.
# ---------------------------------------------------------------

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Die Entwurfsseiten und das Redaktionssystem gehören nicht in den
# Suchindex. robots.txt regelt das bereits; dieser Kopfzeileneintrag
# wirkt zusätzlich und unabhängig davon.
[[headers]]
  for = "/variante-a"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/variante-c"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/designs"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/keystatic/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# ---------------------------------------------------------------
# 🔴 NUR BIS ZUM SWITCH AUF DIE ECHTE DOMAIN.
#
# Solange die Seite ausschließlich unter *.netlify.app läuft, darf
# sie nicht in den Suchindex — sonst stehen später dieselben
# Inhalte unter zwei Adressen.
#
# BEIM SWITCH ERSATZLOS ENTFERNEN. Bleibt der Block drin, ist die
# fertige Seite für Google unsichtbar. Steht auch auf der Liste in
# TERMIN-04-09.md, Abschnitt „Direkt nach dem Switch".
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# ---------------------------------------------------------------
# Weiterleitungen von der alten Joomla-Seite.
#
# Die vier alten Adressen (per Abruf der Seite am 20.08.2026
# bestätigt) waren:
#   /leistungen  /ueber-uns  /kontakt-anfahrt  /impressum
#
# /impressum heißt auf der neuen Seite genauso und braucht keine
# Regel. Die übrigen drei zeigen auf die passenden Abschnitte der
# Startseite.
#
# Wirksam werden sie erst, wenn die Domain auf Netlify zeigt —
# vorher lassen sie sich aber auf der *.netlify.app-Adresse testen.
# ---------------------------------------------------------------
[[redirects]]
  from = "/leistungen"
  to = "/#leistungen"
  status = 301

[[redirects]]
  from = "/ueber-uns"
  to = "/#betrieb"
  status = 301

[[redirects]]
  from = "/kontakt-anfahrt"
  to = "/#kontakt"
  status = 301
